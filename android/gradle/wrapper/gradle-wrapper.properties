distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# 本机 ~/.gradle/wrapper/dists/ 下已有 gradle-9.1.0-all 的完整解压产物
# （dists/gradle-9.1.0-all/7wzd0jkjit61aq2p43wpjgij9/gradle-9.1.0 + gradle-9.1.0-all.zip.ok），
# wrapper 按 distributionUrl 计算目录哈希 ⇒ 命中缓存，无需联网下载。
# 依据：AGP 9.0.x 官方最低/默认 Gradle 均为 9.1.0（settings.gradle 顶部注释）。
distributionUrl=https\://services.gradle.org/distributions/gradle-9.1.0-all.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
