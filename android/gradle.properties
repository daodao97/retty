# mygo Android 宿主工程 —— Gradle 属性

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AGP 9.0 起 useAndroidX 必须有明确取值（默认路径就开，避免 AGP 报配置错误）
android.useAndroidX=true

# ── 关于 JDK ───────────────────────────────────────────────────────────────
# 本机实测 JAVA_HOME **未设置**，PATH 里也没有 java（见 README「环境实测」）。
# 因此运行构建前必须显式给 JDK 17，二选一：
#   1) 命令行/环境变量：export JAVA_HOME="C:/Users/hzy/AppData/Local/Programs/Microsoft/jdk-17.0.10.7-hotspot"
#   2) 拷到别的机器时按需去掉下面这行的注释（机器相关路径，不建议提交）
#org.gradle.java.home=C:/Users/hzy/AppData/Local/Programs/Microsoft/jdk-17.0.10.7-hotspot
