name: Build CLI

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-cli-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-cli:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64, darwin/amd64, darwin/arm64]
    env:
      GOWORK: 'off'
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Test CLI dependency guard
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts -p test_package_cli.py

      - name: Test published APNs SDK stays headless
        run: go test github.com/egoist/mygo/push/apns -run '^TestAPNsProductionDependenciesAreStandardLibraryOnly$'

      - name: Build and bundle CLI
        run: ./scripts/build-cli.sh --platform '${{ matrix.platform }}'

      - name: Test Linux CLI and session lifecycle
        if: matrix.platform == 'linux/amd64'
        env:
          RETTY_CLI_E2E: '1'
          RETTY_CLI_BINARY: '${{ github.workspace }}/build/cli/retty-linux-amd64/retty'
          MYGO_GHOSTTY_VT: '${{ github.workspace }}/build/cli/retty-linux-amd64/libghostty-vt.so'
        run: go test -tags retty_cli ./cmd/retty ./internal/rex ./internal/remote ./internal/terminal/screen

      - name: Archive name
        id: artifact
        env:
          PLATFORM: '${{ matrix.platform }}'
        run: echo "name=Retty-cli-${PLATFORM//\//-}" >> "$GITHUB_OUTPUT"

      - name: Upload CLI
        uses: actions/upload-artifact@v7
        with:
          name: '${{ steps.artifact.outputs.name }}'
          path: |
            build/cli/retty-*.tar.gz
            build/cli/retty-*.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
